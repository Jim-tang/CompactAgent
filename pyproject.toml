    "datasets==4.8.5",
    "fastmcp==3.4.2",
    "flagembedding==1.4.0",
    "httpx==0.28.1",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.7",
    "langchain-core==1.4.0",
    "langchain-huggingface==1.2.2",
    "numpy==2.2.6",
    "openai==2.30.0",
    "prompt-toolkit==3.0.52",
    "pydantic==2.14.1",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "rjieba==0.2.1",
    "sentence-transformers==5.5.0",
    "torch==2.12.0",
